<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simplecraft Brasil - Firestore Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Segoe UI', sans-serif; 
            touch-action: none; 
            user-select: none; 
        }
        canvas { display: block; }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid white; transform: translate(-50%, -50%); mix-blend-mode: difference; }
        .pixel-border { border: 4px solid #3d3d3d; box-shadow: inset -4px -4px 0px #1d1d1d, inset 4px 4px 0px #8d8d8d; background: #4a4a4a; }
        .mobile-btn { 
            width: 54px; height: 54px; background: rgba(255,255,255,0.15); 
            border: 2px solid rgba(255,255,255,0.5); border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .slot-card { background: #2d2d2d; cursor: pointer; transition: transform 0.2s; }
        .slot-card:hover { transform: translateY(-5px); border-color: #fbbf24; }
        #game-msg {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            color: white; font-weight: bold; font-size: 1.5rem; text-shadow: 2px 2px 4px black;
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 30px; height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="setup-screen" class="ui-overlay flex flex-col items-center justify-center bg-[#0f172a] z-[70] interactive">
        <h1 class="text-5xl text-white font-black mb-8 italic">SIMPLECRAFT</h1>
        <div id="auth-status" class="text-white mb-4 text-sm opacity-70">Conectando ao servidor...</div>
        <div class="flex gap-4">
            <button onclick="setDevice('desktop')" class="pixel-border p-6 text-white w-48 hover:scale-105 transition-transform">💻 COMPUTADOR</button>
            <button onclick="setDevice('mobile')" class="pixel-border p-6 text-white w-48 hover:scale-105 transition-transform">📱 CELULAR</button>
        </div>
    </div>

    <div id="save-screen" class="hidden ui-overlay flex flex-col items-center justify-center bg-[#1a1a1a] z-[60] interactive">
        <h2 class="text-2xl text-white font-bold mb-8 uppercase tracking-widest">Selecionar Mundo</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl px-4">
            <div id="slot-1" onclick="handleSlotClick('1')" class="slot-card pixel-border p-6 text-white text-center flex flex-col items-center">
                <p class="text-[10px] text-gray-500 mb-2">SLOT_01</p>
                <div class="slot-info">Carregando...</div>
            </div>
            <div id="slot-2" onclick="handleSlotClick('2')" class="slot-card pixel-border p-6 text-white text-center flex flex-col items-center">
                <p class="text-[10px] text-gray-500 mb-2">SLOT_02</p>
                <div class="slot-info">Carregando...</div>
            </div>
            <div id="slot-3" onclick="handleSlotClick('3')" class="slot-card pixel-border p-6 text-white text-center flex flex-col items-center">
                <p class="text-[10px] text-gray-500 mb-2">SLOT_03</p>
                <div class="slot-info">Carregando...</div>
            </div>
        </div>
    </div>

    <div id="game-hud" class="hidden ui-overlay">
        <div id="game-msg"></div>
        <div class="crosshair"></div>
        <div class="absolute top-4 left-4 p-3 pixel-border text-white text-xs font-mono min-w-[150px]">
            <p id="hud-time">🌞 DIA</p>
            <p id="hud-inv">🪓 Mad: 0 | 🪨 Ped: 0</p>
            <p id="hud-items" class="text-blue-300">📦 Blocos: 0</p>
            <p id="hud-tools" class="text-yellow-400 mt-1">Equipado: Mão</p>
        </div>
        <div class="absolute top-4 right-4 interactive flex gap-2">
            <button id="save-btn" onclick="saveGame()" class="pixel-border px-4 py-2 text-white font-bold hover:bg-green-600">💾 SALVAR</button>
            <button onclick="location.reload()" class="pixel-border px-4 py-2 text-white font-bold hover:bg-red-600">❌ SAIR</button>
        </div>
        
        <div id="mobile-controls" class="hidden interactive">
            <div class="absolute bottom-8 left-8 grid grid-cols-3 gap-3">
                <div></div><div class="mobile-btn" ontouchstart="keys['KeyW']=true" ontouchend="keys['KeyW']=false">↑</div><div></div>
                <div class="mobile-btn" ontouchstart="keys['KeyA']=true" ontouchend="keys['KeyA']=false">←</div>
                <div class="mobile-btn" ontouchstart="keys['KeyS']=true" ontouchend="keys['KeyS']=false">↓</div>
                <div class="mobile-btn" ontouchstart="keys['KeyD']=true" ontouchend="keys['KeyD']=false">→</div>
            </div>
            <div class="absolute bottom-8 right-8 flex flex-col gap-4">
                <button class="pixel-border bg-white/20 text-white font-bold py-4 px-6" onclick="handleAction()">AÇÃO</button>
                <button class="pixel-border bg-blue-500/40 text-white font-bold py-4 px-6" onclick="placeBlock()">BLOCO</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'simplecraft-v1';

        let currentUser = null;
        let worldData = null;
        let activeSlot = null;

        // --- Firebase Auth Logic ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-status').innerText = "Conectado como: " + user.uid.substring(0,8);
                loadAllSlots();
            } else {
                signInAnonymously(auth).catch(err => console.error("Auth Error:", err));
            }
        });

        async function loadAllSlots() {
            for (let i = 1; i <= 3; i++) {
                // RULE 1: STRICT PATHS
                const slotRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'Saves', i.toString());
                const snap = await getDoc(slotRef);
                const infoEl = document.querySelector(`#slot-${i} .slot-info`);
                
                if (snap.exists()) {
                    const data = snap.data();
                    infoEl.innerHTML = `<span class="text-green-400">Mundo Salvo</span><br><span class="text-[10px]">Mad: ${data.inv?.madeira || 0}</span>`;
                } else {
                    infoEl.innerHTML = `<span class="text-gray-500 italic">Espaço Vazio</span>`;
                }
            }
        }

        window.setDevice = (type) => {
            window.deviceType = type;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('save-screen').classList.remove('hidden');
        };

        window.handleSlotClick = async (slot) => {
            activeSlot = slot;
            const slotRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'Saves', slot);
            const snap = await getDoc(slotRef);
            
            const initialData = snap.exists() ? snap.data() : {
                inv: { madeira: 0, pedra: 0, blocos: 5 },
                pos: { x: 0, y: 1.8, z: 5 },
                placed: []
            };
            
            startGame(initialData);
        };

        // --- Game Engine Logic ---
        let scene, camera, renderer, raycaster, clock, worldObjects = [], placedObjects = [];
        let inventory = { madeira: 0, pedra: 0, blocos: 0 };
        window.keys = {};

        function startGame(data) {
            inventory = data.inv;
            document.getElementById('save-screen').classList.add('hidden');
            document.getElementById('game-hud').classList.remove('hidden');
            if (window.deviceType === 'mobile') document.getElementById('mobile-controls').classList.remove('hidden');

            initThree(data.pos, data.placed);
            updateHUD();
        }

        function initThree(startPos, savedPlaced) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(startPos.x, startPos.y, startPos.z);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const amb = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(amb);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x228b22 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Geração de Árvores
            for(let i=0; i<40; i++) {
                createTree((Math.random()-0.5)*100, (Math.random()-0.5)*100);
            }

            // Carregar construções salvas
            savedPlaced?.forEach(p => buildBlock(p.x, p.y, p.z, false));

            raycaster = new THREE.Raycaster();
            clock = new THREE.Clock();

            // Controles Desktop
            if (window.deviceType === 'desktop') {
                document.body.requestPointerLock();
                window.addEventListener('mousemove', e => {
                    if (document.pointerLockElement) {
                        camera.rotation.y -= e.movementX * 0.002;
                        camera.rotation.x -= e.movementY * 0.002;
                        camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                    }
                });
            }

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            animate();
        }

        function createTree(x, z) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), new THREE.MeshLambertMaterial({color: 0x4d2d18}));
            trunk.position.y = 1.5;
            trunk.userData = { type: 'arvore', parentGroup: group };
            group.add(trunk);

            const leaves = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshLambertMaterial({color: 0x2d5a27}));
            leaves.position.y = 3;
            group.add(leaves);

            group.position.set(x, 0, z);
            scene.add(group);
            worldObjects.push(trunk);
        }

        window.handleAction = () => {
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects([...worldObjects, ...placedObjects]);
            if (hits.length > 0 && hits[0].distance < 4) {
                const obj = hits[0].object;
                if (obj.userData.type === 'arvore') {
                    inventory.madeira += 3;
                    scene.remove(obj.userData.parentGroup);
                    worldObjects = worldObjects.filter(o => o !== obj);
                } else {
                    scene.remove(obj);
                    placedObjects = placedObjects.filter(o => o !== obj);
                }
                updateHUD();
            }
        };

        window.placeBlock = () => {
            if (inventory.blocos <= 0) return;
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            const pos = camera.position.clone().add(dir.multiplyScalar(3));
            buildBlock(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z), true);
        };

        function buildBlock(x, y, z, consume) {
            const block = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({color: 0x888888}));
            block.position.set(x, Math.max(0.5, y), z);
            scene.add(block);
            placedObjects.push(block);
            if(consume) { inventory.blocos--; updateHUD(); }
        }

        window.saveGame = async () => {
            if (!currentUser || !activeSlot) return;
            const btn = document.getElementById('save-btn');
            btn.innerText = "SALVANDO...";
            
            const data = {
                inv: inventory,
                pos: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
                placed: placedObjects.map(p => ({ x: p.position.x, y: p.position.y, z: p.position.z })),
                updatedAt: Date.now()
            };

            try {
                const slotRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'Saves', activeSlot);
                await setDoc(slotRef, data);
                showMsg("Jogo Salvo no Firestore!");
            } catch (e) {
                console.error(e);
                showMsg("Erro ao salvar!");
            }
            btn.innerText = "💾 SALVAR";
        };

        function updateHUD() {
            document.getElementById('hud-inv').innerText = `🪓 Mad: ${inventory.madeira} | 🪨 Ped: ${inventory.pedra}`;
            document.getElementById('hud-items').innerText = `📦 Blocos: ${inventory.blocos}`;
        }

        function showMsg(txt) {
            const el = document.getElementById('game-msg');
            el.innerText = txt; el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 2000);
        }

        function animate() {
            requestAnimationFrame(animate);
            const speed = 0.1;
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion); dir.y = 0; dir.normalize();
            const side = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion); side.y = 0; side.normalize();

            if (keys['KeyW']) camera.position.add(dir.multiplyScalar(speed));
            if (keys['KeyS']) camera.position.sub(dir.multiplyScalar(speed));
            if (keys['KeyA']) camera.position.sub(side.multiplyScalar(speed));
            if (keys['KeyD']) camera.position.add(side.multiplyScalar(speed));

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
